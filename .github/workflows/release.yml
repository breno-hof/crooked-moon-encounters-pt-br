name: Release Foundry module

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./module.json').version")
          test "$TAG_VERSION" = "$MANIFEST_VERSION"
      - name: Build module archive
        shell: bash
        run: |
          mkdir -p dist/crooked-moon-encounters-pt-br
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' \
            module.json README.md LICENSE scripts data \
            dist/crooked-moon-encounters-pt-br/
          cd dist
          zip -r ../crooked-moon-encounters-pt-br.zip crooked-moon-encounters-pt-br
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            module.json
            crooked-moon-encounters-pt-br.zip
